<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>My WebOS</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div id="welcome-window" class="window">
    <div id="welcome-windowheader" class="window-header">
      <span>Welcome!</span>
      <button id="close-welcome" class="close-btn">X</button>
    </div>
    
    <div class="window-content">
      <h2>Hello World!</h2>
      <p>This is my WebOS for Stardance.</p>
      <p>I will add my games here later!</p>
    </div>
  </div>

  <div id="desktop"></div>

  <div id="taskbar">
    <button id="start-btn">Menu</button>
    <button class="app-icon" id="open-welcome">Welcome App</button>
    <div id="clock">12:00 PM</div>
  </div>

  <script src="script.js"></script>
</body>
</html>
